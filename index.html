<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鲨克快跑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f7f7f7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  canvas {
    border-bottom: 3px solid #535353;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #fff;
  }
  #hint { margin-top: 12px; color: #535353; font-size: 14px; }
  #debug { margin-top: 6px; color: #999; font-size: 11px; }
  #tip { margin-top: 8px; color: #ff6b6b; font-size: 12px; }
  #load-status { margin-top: 8px; color: #535353; font-size: 14px; }
  #retry-load { margin-top: 8px; padding: 4px 10px; }
</style>
</head>
<body>
<canvas id="game" hidden></canvas>
<div id="load-status" role="status">正在加载游戏资源…</div>
<button id="retry-load" type="button" hidden>重试加载</button>
<div id="hint" hidden>按空格键开始 / 跳跃 &nbsp;|&nbsp; ↓ 滑行 / 空中急降</div>
<div id="debug"></div>
<div id="tip">如果游戏速度异常，请按 Ctrl+Shift+R 强制刷新</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const debugEl = document.getElementById('debug');

const W = 800, H = 400; // 增加画布高度从 260 到 400
canvas.width = W;
canvas.height = H;

// ============ 配置 ============
const SCALE = 0.085;
const RUN_CYCLE = 18;
const RUN_FPS = 24;
const GRAVITY = 0.85;
const JUMP_FORCE = -15.5;
const SLIDE_LOCK_FRAMES = 18;  // 急降滑行最短持续帧数（0.3 秒 @60FPS）
const FAST_FALL_SPEED = 10.0;  // 急降速度（像素/帧，@60FPS 基准）
const FPS_REF = 60;           // 归一化基准帧率：所有「每帧」参数都以此为参照
const HITBOX_MARGIN = 10;

// ============ 工具：扫描图片非透明像素的边界 ============
function getBoundedImg(img) {
  const tmpCanvas = document.createElement('canvas');
  const tmpCtx = tmpCanvas.getContext('2d');
  tmpCanvas.width = img.naturalWidth;
  tmpCanvas.height = img.naturalHeight;
  tmpCtx.drawImage(img, 0, 0);
  const data = tmpCtx.getImageData(0, 0, tmpCanvas.width, tmpCanvas.height).data;
  let minX = tmpCanvas.width, minY = tmpCanvas.height, maxX = 0, maxY = 0;
  for (let y = 0; y < tmpCanvas.height; y++) {
    for (let x = 0; x < tmpCanvas.width; x++) {
      const i = (y * tmpCanvas.width + x) * 4;
      if (data[i + 3] > 0) { // alpha > 0
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < minX || maxY < minY) return null;
  const w = maxX - minX + 1;
  const h = maxY - minY + 1;
  return { img, x: minX, y: minY, w, h };
}

// ============ 加载资源 ============
const FRAME_DIR = 'frames/';
const STANDING_IMG = 'stand.png';
const SLIDE_IMG = 'slide.png';
const OBSTACLE_DIR = 'obstacles/';
const BG_DIR = 'Background/';

const bgLayers = [
  { speed: 0.1, file: 'BG2.png' },
  { speed: 0.3, file: 'BG.png' },
  { speed: 0.5, file: 'mid.png' },
  { speed: 0.8, file: 'fore.png' },
  { speed: 1.0, file: 'foreground.png' }
];
const runFrames = Array(RUN_CYCLE).fill(null);
const obstacleImages = {};
let standImg = null, slideImg = null;
let ready = false, loading = false;
const loadStatus = document.getElementById('load-status');
const retryLoad = document.getElementById('retry-load');

function loadImage(path) {
  return new Promise(resolve => {
    const img = new Image();
    const finish = result => {
      clearTimeout(timeout);
      img.onload = img.onerror = null;
      resolve(result);
    };
    const timeout = setTimeout(() => finish(null), 10000);
    img.onload = () => finish(img.naturalWidth && img.naturalHeight ? img : null);
    img.onerror = () => finish(null);
    img.src = path;
  });
}

async function loadGame() {
  if (loading || ready) return;
  loading = true;
  retryLoad.hidden = true;
  loadStatus.textContent = '正在加载游戏资源…';
  const failed = [];
  async function load(path) {
    const img = await loadImage(path);
    if (!img) failed.push(path);
    return img;
  }

  try {
    await Promise.all([
      ...runFrames.map(async (_, i) => {
        runFrames[i] = await load(FRAME_DIR + 'frame_' + String(i + 1).padStart(4, '0') + '.png');
      }),
      ...bgLayers.map(async layer => { layer.img = await load(BG_DIR + layer.file); }),
      ...Object.keys(OBS_DEFS).map(async type => {
        obstacleImages[type] = await load(OBSTACLE_DIR + type + '.png');
      }),
      load(STANDING_IMG).then(img => { standImg = img; }),
      load(SLIDE_IMG).then(img => { slideImg = img; })
    ]);
    if (!runFrames.some(Boolean)) throw new Error('跑步动画未能加载，请检查 frames/ 中的图片。');
    if (!ctx) throw new Error('当前浏览器无法创建游戏画布。');
    initGame();
    ready = true;
    canvas.hidden = false;
    document.getElementById('hint').hidden = false;
    loadStatus.hidden = true;
    if (failed.length) log(`部分素材未加载，已使用备用画面（${failed.length} 项）`);
    requestAnimationFrame(loop);
  } catch (error) {
    loadStatus.textContent = `无法启动游戏：${error.message}`;
    retryLoad.hidden = false;
  } finally {
    loading = false;
  }
}

function log(msg) {
  debugEl.textContent = msg;
}

// ============ 游戏状态 ============
const STATE = { WAIT: 0, PLAY: 1, OVER: 2 };
let state = STATE.WAIT;
const BASE_SPEED = 7.5;
const HIGH_SCORE_KEY = 'xiaoke_highscore';
let score = 0, speed = BASE_SPEED;
let highScore = readHighScore();

function readHighScore() {
  try {
    const stored = Number(localStorage.getItem(HIGH_SCORE_KEY));
    return Number.isSafeInteger(stored) && stored > 0 ? stored : 0;
  } catch {
    return 0;
  }
}

function saveHighScore() {
  highScore = Math.max(highScore, Math.floor(score));
  try {
    localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
  } catch {
    // 无法持久化时，本次页面仍保留内存中的最高分。
  }
}
let frameTimer = 0, runFrameIdx = 0;

const player = { x: 80, y: 0, vy: 0, grounded: true, ducking: false, duckHeld: false, slideTimer: 0, fastFall: false };
let obstacles = [];
let groundY = H - 40;

let playerDrawW = 0, playerDrawH = 0;
let standBounded = null;
let slideBounded = null;
// slide.png 的非透明区域；直接打开本地页面时无需读取 Canvas 像素。
const SLIDE_CROP = { sourceW: 627, sourceH: 627, x: 159, y: 209, w: 309, h: 193 };
let standDrawW = 0, standDrawH = 0;
let slideDrawW = 0, slideDrawH = 0;

// ============ 初始化 ============
function cropPose(img, knownCrop) {
  if (!img) return null;
  if (knownCrop && img.naturalWidth === knownCrop.sourceW && img.naturalHeight === knownCrop.sourceH) {
    const { x, y, w, h } = knownCrop;
    return { img, x, y, w, h };
  }
  try {
    return getBoundedImg(img);
  } catch {
    // file:// 下不能读取像素时，滑行可直接绘制原图，待机沿用首帧备用。
    return knownCrop ? { img, x: 0, y: 0, w: img.naturalWidth, h: img.naturalHeight } : null;
  }
}

function drawPose(pose, x, y, w, h) {
  ctx.drawImage(pose.img, pose.x, pose.y, pose.w, pose.h, x, y, w, h);
}

function initGame() {
  const firstFrame = runFrames.find(Boolean);
  const srcW = firstFrame.naturalWidth;
  const srcH = firstFrame.naturalHeight;
  let lastFrame = firstFrame;
  for (let i = 0; i < runFrames.length; i++) {
    lastFrame = runFrames[i] || lastFrame;
    runFrames[i] = lastFrame;
  }
  // 跑步帧略大一些（1.3倍），站立/滑行保持与其他一致
  playerDrawW = Math.round(srcW * SCALE * 1.3);
  playerDrawH = Math.round(srcH * SCALE * 1.3);

  standBounded = cropPose(standImg);
  slideBounded = cropPose(slideImg, SLIDE_CROP);
  standDrawH = Math.round(playerDrawH * 0.9);
  standDrawW = playerDrawW;
  slideDrawH = Math.max(21, Math.round(playerDrawH * 0.60));
  slideDrawW = playerDrawW;

  // 站立/滑行图以跑步帧高度为基准，等比缩放，保证三者视觉一致
  if (standBounded) {
    standDrawH = Math.round(playerDrawH * 0.9);
    standDrawW = Math.round(standBounded.w * (standDrawH / standBounded.h));
    log(`stand content=${standBounded.w}x${standBounded.h} → render=${standDrawW}x${standDrawH}`);
  }
  if (slideBounded) {
    slideDrawH = Math.round(playerDrawH * 0.60);
    slideDrawW = Math.round(slideBounded.w * (slideDrawH / slideBounded.h));
    log(`slide content=${slideBounded.w}x${slideBounded.h} → render=${slideDrawW}x${slideDrawH}`);
  }

  // 地面线根据最大角色高度决定
  const maxH = Math.max(playerDrawH, standDrawH, slideDrawH);
  groundY = H - maxH - 10;
  log(`player=${playerDrawW}x${playerDrawH} groundY=${groundY}`);
  resetGame();
}

function resetGame() {
  state = STATE.WAIT;
  score = 0; speed = BASE_SPEED;
  // highScore 不从 localStorage 重置，保持历史最高
  obstacles = [];
  player.y = 0;
  player.vy = 0; player.grounded = true; player.ducking = false;
  player.duckHeld = false; player.slideTimer = 0;
  player.fastFall = false;
  runFrameIdx = 0; frameTimer = 0;
}

// ============ 输入 ============
document.addEventListener('keydown', e => {
  if (!ready) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (!AudioSystem.bgm) {
      AudioSystem.init();
      AudioSystem.playBGM();
    }
    if (state === STATE.WAIT || state === STATE.OVER) {
      resetGame();
      state = STATE.PLAY;
    } else if (state === STATE.PLAY && player.grounded) {
      player.vy = JUMP_FORCE;
      player.grounded = false;

    }
  }
  if (e.code === 'ArrowDown') {
    e.preventDefault();
    if (state === STATE.PLAY) {
      player.duckHeld = true;
      if (!player.grounded && !player.fastFall) {
        // 空中按 ↓ 急降：进入快速下降动画，落地后自动转入滑行
        player.fastFall = true;
        player.vy = 0;
      }
      player.ducking = true;
    }
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'ArrowDown') {
    player.duckHeld = false;
    // 急降中松手不取消滑行姿态，只等落地后再解除
    if (player.slideTimer <= 0 && !player.fastFall) player.ducking = false;
  }
});

// ============ 障碍物 ============
// 每种障碍物的预设尺寸（基于实际抠图尺寸）
const OBS_DEFS = {
  ground1: { w: 35,  h: 45 },   // 93x120 → 约35x45
  ground2: { w: 50,  h: 43 },   // 147x125 → 约50x43
  low:     { w: 55,  h: 53 },   // 484x470 → 约55x53（接近正方形）
  high:    { w: 25,  h: 45 },   // 86x140 → 约25x45（瘦高型）
};

// 随机在基础尺寸上±20%变化（保持原比例）
function randomScale(baseW, baseH) {
  const varRange = 0.4; // ±20%
  const scale = 1 + (Math.random() - 0.5) * varRange; // 0.8 ~ 1.2
  return {
    w: Math.round(baseW * scale),
    h: Math.round(baseH * scale)
  };
}

function spawnObstacleAt(x, forceType) {
  // 如果指定了 forceType，直接使用；否则随机生成
  let w, h, y, obsType;

  if (forceType) {
    // 强制使用指定类型
    obsType = forceType;
    if (forceType === 'ground1' || forceType === 'ground2') {
      const def = OBS_DEFS[forceType];
      const size = randomScale(def.w, def.h);
      w = size.w; h = size.h;
      y = groundY - h;
    } else if (forceType === 'low') {
      const def = OBS_DEFS.low;
      const size = randomScale(def.w, def.h);
      w = size.w; h = size.h;
      y = groundY - slideDrawH - h - 5;
    } else if (forceType === 'high') {
      const def = OBS_DEFS.high;
      const size = randomScale(def.w, def.h);
      w = size.w; h = size.h;
      y = groundY - playerDrawH - h - 20;
    }
  } else {
    // 随机生成类型
    const type = Math.random();
    if (type < 0.58) {
      // 地面障碍
      const big = Math.random() < 0.3;
      const def = big ? OBS_DEFS.ground2 : OBS_DEFS.ground1;
      const size = randomScale(def.w, def.h);
      w = size.w; h = size.h;
      y = groundY - h;
      obsType = big ? 'ground2' : 'ground1';
    } else if (type < 0.70) {
      // 低空飞行障碍
      const def = OBS_DEFS.low;
      const size = randomScale(def.w, def.h);
      w = size.w; h = size.h;
      y = groundY - slideDrawH - h - 5;
      obsType = 'low';
    } else {
      // 高空飞行障碍
      const def = OBS_DEFS.high;
      const size = randomScale(def.w, def.h);
      w = size.w; h = size.h;
      y = groundY - playerDrawH - h - 20;
      obsType = 'high';
    }
  }
  const obstacle = { x, w, h, y, type: obsType };
  obstacles.push(obstacle);
  return obstacle;
}

function canJumpOverPair(first, second) {
  const clearance = Math.max(first.h, second.h) - HITBOX_MARGIN;
  // 用 33ms 上限对应的积分误差估算保守的跳跃净空时间（60Hz 基准帧）。
  const jumpSpeed = -JUMP_FORCE - GRAVITY * (33 / 16.67) / 2;
  const discriminant = jumpSpeed ** 2 - 2 * GRAVITY * clearance;
  if (discriminant <= 0) return false;
  const clearFrames = 2 * Math.sqrt(discriminant) / GRAVITY - 33 / 16.67;
  const span = second.x + second.w - first.x + Math.max(1, playerDrawW - 2 * HITBOX_MARGIN);
  return span <= speed * clearFrames;
}

function refillObstacles() {
  const spawnEdge = W + 80;
  const last = obstacles[obstacles.length - 1];
  const rightEdge = last ? last.x + last.w : 0;
  if (last && rightEdge > spawnEdge) return;

  // 上一组移近屏幕后才补一组；组间距离从上一组尾端算起。
  const gap = speed * FPS_REF * (1 + Math.random() * 0.5);
  const first = spawnObstacleAt(last ? Math.max(spawnEdge, rightEdge + gap) : spawnEdge);
  if ((first.type === 'ground1' || first.type === 'ground2') && Math.random() < 0.3) {
    const comboX = first.x + first.w + 2 + Math.random() * 5;
    const second = spawnObstacleAt(comboX, Math.random() < 0.4 ? 'ground2' : 'ground1');
    if (!canJumpOverPair(first, second)) obstacles.pop();
  }
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function getPlayerRect() {
  const isSlide = player.ducking && player.grounded;
  const dw = isSlide ? slideDrawW : playerDrawW;
  const dh = isSlide ? slideDrawH : playerDrawH;
  const dy = groundY - dh + player.y;
  const margin = HITBOX_MARGIN;
  return { x: player.x + margin, y: dy + margin, w: Math.max(1, dw - margin * 2), h: Math.max(1, dh - margin * 2) };
}

// ============ 主循环 ============
let lastTimestamp = 0;
function loop(timestamp) {
  const dt = Math.min(timestamp - lastTimestamp, 33);
  lastTimestamp = timestamp;
  update(dt);
  draw(dt);
  requestAnimationFrame(loop);
}

function update(dt) {
  if (state !== STATE.PLAY) return;

  frameTimer += dt;
  if (frameTimer >= 1000 / RUN_FPS) {
    frameTimer -= 1000 / RUN_FPS;
    runFrameIdx = (runFrameIdx + 1) % RUN_CYCLE;
  }

  // 跳跃/急降/滑行锁定：按 dt 归一化到 60Hz 基准，避免高刷新率显示器让手感不一致
  const norm = dt / 16.67;
  if (player.fastFall) {
    // 急降：匀速下降，速度可调
    player.y += FAST_FALL_SPEED * norm;
    if (player.y >= 0) {
      player.y = 0; player.vy = 0; player.grounded = true;
      player.fastFall = false;
      // 滑行锁定从落地这一帧才开始计时
      player.slideTimer = SLIDE_LOCK_FRAMES;
    }
  } else {
    player.vy += GRAVITY * norm;
    player.y += player.vy * norm;
    if (player.y >= 0) { player.y = 0; player.vy = 0; player.grounded = true; }
  }

  // 急降滑行锁定倒计时：按 dt 归一化，锁定期满且未按住时才解除滑行
  if (player.slideTimer > 0) {
    player.slideTimer -= norm;
    if (player.slideTimer <= 0 && !player.duckHeld) player.ducking = false;
  }

  // 障碍物移动：按 dt 归一化到 60Hz 基准，避免高刷新率显示器下速度异常
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].x -= speed * norm;
    if (obstacles[i].x + obstacles[i].w < 0) obstacles.splice(i, 1);
  }

  refillObstacles();

  const pRect = getPlayerRect();
  for (const obs of obstacles) {
    if (rectsOverlap(pRect, obs)) {
      state = STATE.OVER;
      if (Math.floor(score) > highScore) saveHighScore();
      AudioSystem.play('hit');
      log(`OVER score=${Math.floor(score)}`);
      return;
    }
  }

  score += dt * 0.05;
  speed = BASE_SPEED + Math.floor(score / 300) * 0.3;
}

// ============ 绘制 ============
let bgOffset = 0; // 背景滚动偏移（连续小数偏移，避免按帧跳跃）

function draw(dt) {
  // 绘制多层视差背景
  // 使用 dt（毫秒）归一化，避免高刷新率显示器让游戏变快
  const ms = dt || 16.67;
  if (bgLayers.some(layer => !layer.img)) {
    ctx.fillStyle = '#b4bdd3';
    ctx.fillRect(0, 0, W, H);
  }
  bgLayers.forEach(layer => {
    if (!layer.img) return;
    const imgW = layer.img.naturalWidth;
    const imgH = layer.img.naturalHeight;
    const drawH = H;
    const drawW = (imgW / imgH) * drawH;
    // 按时间和层速度累加偏移
    bgOffset += speed * 0.15 * layer.speed * (ms / 16.67);
    const layerOffset = bgOffset % drawW;
    // 绘制两层实现无缝滚动
    ctx.drawImage(layer.img, -layerOffset, 0, drawW, drawH);
    ctx.drawImage(layer.img, drawW - layerOffset, 0, drawW, drawH);
  });
  ctx.strokeStyle = '#535353';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();

  drawPlayer();

  // 障碍物（用图片绘制）
  for (const obs of obstacles) {
    const img = obstacleImages[obs.type];
    if (img) {
      ctx.drawImage(img, obs.x, obs.y, obs.w, obs.h);
    } else {
      ctx.fillStyle = '#535353';
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
    }
  }

  ctx.fillStyle = '#535353';
  ctx.font = '18px Courier New';
  ctx.textAlign = 'right';
  ctx.fillText(`Score: ${Math.floor(score)}`, W - 20, 30);
  if (highScore > 0) {
    ctx.font = '14px Courier New';
    ctx.fillText(`HI: ${Math.floor(highScore)}`, W - 20, 50);
  }

  if (state === STATE.WAIT) drawCenterText('鲨克快跑', '按空格键开始');
  else if (state === STATE.OVER) drawCenterText('GAME OVER', '按空格键重试');
}

function drawPlayer() {
  const px = player.x;

  if (state === STATE.WAIT) {
    if (standBounded) drawPose(standBounded, px, groundY - standDrawH, standDrawW, standDrawH);
    else ctx.drawImage(runFrames[0], px, groundY - standDrawH, standDrawW, standDrawH);
    return;
  }

  const isSlide = player.ducking && player.grounded;
  // 急降过程中用滑行姿势朝下压低身形，落地瞬间衔接滑行
  if (isSlide || player.fastFall) {
    const dy = isSlide ? groundY - slideDrawH : groundY - playerDrawH + player.y;
    if (slideBounded) {
      drawPose(slideBounded, px, dy, slideDrawW, slideDrawH);
    } else {
      ctx.drawImage(runFrames[runFrameIdx], px, dy, slideDrawW, slideDrawH);
    }
    return;
  }

  // 跑步 / 跳跃
  const img = runFrames[runFrameIdx];
  const dy = groundY - playerDrawH + player.y;
  ctx.drawImage(img, px, dy, playerDrawW, playerDrawH);
}

function drawCenterText(line1, line2) {
  ctx.fillStyle = '#2d7ff9';
  ctx.textAlign = 'center';
  ctx.font = 'bold 32px Courier New';
  ctx.fillText(line1, W / 2, H / 2 - 10);
  ctx.font = '16px Courier New';
  ctx.fillText(line2, W / 2, H / 2 + 20);
}

// ============ 音频系统 ============
const AudioSystem = {
  bgm: null,
  sounds: {},
  enabled: true,

  init() {
    // 加载背景音乐
    this.bgm = new Audio('audio/background.mp3');
    this.bgm.loop = true;
    this.bgm.volume = 0.3;

    // 加载音效
    this.sounds.hit = new Audio('audio/hit.mp3');
  },

  playBGM() {
    if (!this.enabled || !this.bgm) return;
    this.bgm.currentTime = 0;
    this.bgm.play().catch(e => console.log('BGM play failed:', e));
  },

  stopBGM() {
    if (this.bgm) this.bgm.pause();
  },

  play(name) {
    if (!this.enabled || !this.sounds[name]) return;
    const sound = this.sounds[name].cloneNode();
    sound.volume = 0.5;
    sound.play().catch(e => console.log('Sound play failed:', e));
  },

  toggle() {
    this.enabled = !this.enabled;
    if (!this.enabled) this.stopBGM();
    else this.playBGM();
    return this.enabled;
  }
};

retryLoad.addEventListener('click', loadGame);
loadGame();
</script>
